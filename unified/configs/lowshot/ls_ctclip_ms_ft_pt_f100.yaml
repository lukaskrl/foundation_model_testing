# Hand-written twin of ls_ctclip_ft_pt_f100.yaml — the ONLY differences are
# pyramid_mode (multiscale vs upsample) and the canvases list. batch_size,
# grad_accum_steps, freeze_backbone, pretrained and train_fraction are copied
# verbatim so the A/B is matched, and both adapters have 509,888 params.
# See configs/models/ctclip_multiscale.yaml for the canvas rationale.
model:
  name: ctclip
  batch_size: 2
  weights: /store/home/skrljl/projects/foundation_models/weights/CT-CLIP/models/CT-CLIP-Related/CT-CLIP_v2.pt
  preprocessing:
    # Must match ls_ctclip_ft_pt_f100.yaml (auto-generated from
    # configs/models/ctclip.yaml) or the A/B stops being single-variable.
    # CT-CLIP's own normalization: clip [-1000, 1000] HU, /1000 -> [-1, 1].
    intensity:
      mode: range
      a_min: -1000.0
      a_max: 1000.0
      b_min: -1.0
      b_max: 1.0
      clip: true
  kwargs:
    dim: 512
    codebook_size: 8192
    image_size: 480
    patch_size: 20
    temporal_patch_size: 10
    spatial_depth: 4
    temporal_depth: 4
    dim_head: 32
    heads: 8
    use_image_encoder_only: true
    pyramid_mode: multiscale
    canvases: [120, 200, 320]
  grad_accum_steps: 2
  freeze_backbone: false
  pretrained: true
data:
  train_fraction: 1.0
