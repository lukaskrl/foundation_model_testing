# Shared base config — all models inherit from this.
# Per-model configs may override `model:` and deep-merge onto `head:`/`data:`/
# `eval:`; `train:` stays globally locked (ConfigLoader rejects it) so the
# optimizer/schedule/loss recipe is identical across runs. Leave head/data/eval
# at these defaults for any CROSS-BACKBONE comparison; override them only for a
# deliberate best-effort or protocol run (larger FOV, low-shot fraction, etc.).

data:
  dataset_root: /store/Datasets/TotalSegmentatorDataset
  meta_csv: /store/Datasets/TotalSegmentatorDataset/meta.csv
  num_classes: 118                     # 117 organs + background
  # Low-shot data-fraction protocol (frozen/low-shot benchmark track). Fraction
  # of the TRAIN split to keep (val is never subset). Subsets are NESTED across
  # fractions and the seed is model-independent, so every encoder sees the
  # identical subset at a given fraction. 1.0 = full split (default, no-op);
  # override per-run, e.g. data.train_fraction: 0.05.
  train_fraction: 1.0
  train_fraction_seed: 1234
  classes_file: unified/data/classes.txt
  spacing: [1.5, 1.5, 1.5]             # mm, isotropic resample target
  # Default HU window matches the CT-FM pretraining recipe (broad CT range).
  # Per-encoder overrides live in model.preprocessing.intensity.
  intensity:
    a_min: -1024.0
    a_max: 2048.0
    b_min: 0.0
    b_max: 1.0
    clip: true
  patch_size: [96, 96, 96]
  num_samples_per_volume: 2
  # Class-balanced patch sampler. ratios has length num_classes; default
  # (computed in transforms.py) gives ratio 0 to background and 1 to every
  # organ class — i.e. every patch is centered on some organ, sampled
  # uniformly across the 117 classes. Override here to use a custom weighting.
  sampler:
    ratios: null
  cache_rate: 0.0                      # MONAI in-memory cache; bump if RAM permits
  # Disk cache for the MODEL-INDEPENDENT preprocessing prefix
  # (EnsureTyped → Spacingd → CropForegroundd). First epoch populates it;
  # subsequent epochs skip the raw NIfTI I/O and the resample entirely.
  # Orientation and HU windowing are intentionally NOT cached — they run on
  # the fly after the cache load, so one cache directory serves every model.
  cache:
    enabled: true
    dir: /volatile/Datasets/TotalSeg
  num_workers: 6                       # reduced from 16 to cut dataloader RSS on the shared, OOM-prone node
  # CropForegroundd margin (in voxels). CT-FM keeps a 10-voxel margin around
  # the foreground bbox; unified previously used 0 (tight crop). Margin > 0
  # protects against truncating organs at the field-of-view boundary.
  crop_foreground_margin: 10
  augment:
    # flip_prob now drives a LATERALITY-SAFE left<->right mirror (transforms.py):
    # it flips along the L-R axis AND swaps *_left<->*_right labels, so laterality
    # is preserved (unlike a plain flip, which is why flips used to be disabled).
    # Kept at 0 here so the fair cross-backbone sweep is unchanged; set >0 (e.g.
    # 0.5) per-run to enable the mirror (see configs/models/ctfm_sigmoid_mirror).
    # rot90 is NOT made laterality-safe (a 180° axial rotation also swaps L/R), so
    # leave rot_prob=0 unless doing a dedicated ablation.
    flip_prob: 0.0
    rot_prob: 0.0
    # Continuous affine: rotation in radians (CT-FM uses 0.26 rad ≈ 15° on each
    # axis) and scale around 1.0 — realistic patient-positioning variation, and
    # the CT-FM recipe's sole spatial augmentation.
    affine_prob: 0.2
    affine_rotate_rad: 0.26
    affine_scale_factor: 0.20
    scale_intensity_prob: 0.5
    scale_intensity_factor: 0.30
    shift_intensity_prob: 0.5
    shift_intensity_factor: 0.10
    gauss_smooth_prob: 0.2
    gauss_noise_prob: 0.2
    gauss_noise_std: 0.10
    # Tier-1 recipe upgrade (nnU-Net-style, image-only, laterality-safe). Both
    # lift the shared ceiling for every backbone; set prob 0 to ablate back to
    # the prior recipe.
    lowres_prob: 0.25                    # simulate-low-resolution: robustness to resolution/scanner
    lowres_zoom_range: [0.5, 1.0]        # downsample to 50-100% of size, then upsample back
    gamma_prob: 0.3                      # nonlinear intensity remap
    gamma_range: [0.7, 1.5]

train:
  batch_size: 2
  epochs: 500
  optimizer:
    name: adamw
    lr: 2.0e-4
    weight_decay: 1.0e-5
  scheduler:
    name: warmup_cosine
    warmup_epochs: 10
    min_lr: 1.0e-6
  loss:
    name: dice_ce
    # Include the background channel in the Dice term, matching the official
    # CT-FM TotalSegmentatorV2 recipe (DiceCELoss include_background: True). The
    # reported metric still excludes background (evaluator DiceMetric
    # include_background=False), so this only affects optimization — it
    # calibrates the softmax background logit rather than letting it drift.
    include_background: true
    softmax: true
    to_onehot_y: true
    # Tier-1: batch Dice (nnU-Net default) — Dice denominator over the whole
    # batch, stabilizing gradients for small/rare classes (ribs, adrenals,
    # prostate). false => per-sample Dice (the prior behavior).
    batch_dice: true
    # Optional inverse-frequency class weights (length = num_classes, background
    # included), applied to both Dice and CE. null => uniform. Populate from the
    # dataset fingerprint's per-class voxel counts; inert until then.
    ce_class_weights: [1.0, 2.257, 2.369, 0.28, 1.811, 0.224, 0.225, 1.983, 1.368, 1.921, 0.315, 0.996, 0.97, 0.186, 2.124, 2.672, 0.379, 0.695, 0.759, 0.397, 0.404, 1.063, 0.251, 0.247, 0.351, 0.356, 0.713, 0.693, 0.188, 0.281, 0.282, 0.709, 0.686, 1.245, 1.245, 0.965, 1.069, 0.327, 0.335, 0.537, 2.63, 3.141, 0.415, 0.418, 0.115, 0.155, 0.146, 0.236, 0.144, 0.159, 0.589, 0.991, 1.372, 1.002, 1.519, 1.218, 1.521, 2.478, 1.415, 1.322, 1.194, 1.118, 1.038, 1.008, 1.077, 1.111, 1.52, 1.219, 1.544, 2.512, 1.421, 1.34, 1.205, 1.113, 1.048, 1.011, 1.06, 1.098, 0.405, 0.504, 0.508, 0.357, 0.174, 0.506, 0.297, 0.593, 0.251, 1.615, 1.717, 1.047, 1.284, 0.782, 0.401, 2.236, 2.025, 2.389, 2.331, 2.191, 1.908, 1.354, 0.655, 0.668, 0.654, 0.655, 0.667, 0.769, 1.02, 0.717, 0.68, 0.66, 0.994, 1.006, 0.983, 0.968, 0.966, 0.917, 0.86, 0.786]
  amp: true
  grad_accum_steps: 1                  # effective batch = batch_size * grad_accum_steps; model configs may override
  grad_clip: 1.0
  log_interval_steps: 50
  ckpt_interval_epochs: 10
  val_interval_epochs: 25
  early_stop_patience: 5               # validation rounds w/o mean_dice improvement; 0 disables (~125 epochs at val_interval 25)
  early_stop_min_delta: 0.002          # Tier-1: min mean_dice gain to count as improvement (kills the sub-noise tail); 0 = prior behavior
  seed: 42

eval:
  sliding_window:
    roi_size: [96, 96, 96]
    sw_batch_size: 2                   # reduced from 4 to shrink the validation memory spike (no effect on metrics)
    overlap: 0.5
    mode: gaussian
  metrics:
    - dice
    - hd95
  # Metrics for the periodic in-training validation only (checkpoint selection
  # uses mean_dice). HD95 builds full-resolution CPU one-hot volumes per case
  # (one channel per organ present), spiking host RAM to ~224 GB across the val
  # set — which the shared node's OOM-killer turns into a SIGKILL at validation
  # boundaries (every val_interval_epochs). So training-time val runs dice only;
  # scripts/evaluate.py still uses the full `metrics` list above for final eval.
  val_metrics:
    - dice
  save_predictions: false

# decoder is also shared. The 5-level finest-first contract is documented in
# unified/models/seg_model.py. decoder_channels is kept in this block for
# backward-compat with older configs; the U-Net head no longer uses it.
head:
  name: unified_seg_head
  num_classes: 118
  feature_channels: [32, 64, 128, 256, 512]
  feature_strides: [1, 2, 4, 8, 16]
  decoder_channels: 32
  norm: instance
  # Multi-resolution Dice-CE: heads at strides {1, 2, 4, 8}, weighted sum.
  # Applies uniformly to every backbone — does not break the fairness lock.
  deep_supervision: true
  ds_weights: [1.0, 0.5, 0.25, 0.125]

# Experiment tracking. Top-level (outside the locked train/data/eval blocks)
# because logging is infrastructure, not a fair-comparison hyperparameter.
# Override `mode` per-run via the WANDB_MODE env var (online | offline | disabled).
wandb:
  project: unified-foundation-models
  entity: null          # null -> your default W&B entity
  mode: online

# Placeholder — every model config overrides this.
model:
  name: REQUIRED
