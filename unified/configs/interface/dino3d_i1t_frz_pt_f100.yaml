# I1 + upsampled stride-2 skip (trilinear) — the upsampler-inside-a-head experiment
# (docs/UPSAMPLER_PLAN.md, "Inside a trained head"). Identical to
# dino3d_i1_frz_pt_f100.yaml except for the three marked lines: the coarsest
# projected feature is delivered again at stride 2, by trilinear interpolation (the control for the guided variant).
# Zero extra trainable parameters (scripts/test_upsampler.py --interface).
# data.guide_hu adds the raw-HU patch as input channel 1; the trilinear control ignores it, so the pipeline matches the guided run.
# Same 500-epoch recipe as I1/I2, so validation at any epoch compares directly with
# runs/interface/dino3d_i1_frz_pt_f100 and dino3d_i2_frz_pt_f100 at that epoch.
model:
  name: dino3d
  batch_size: 3
  weights: /home/lukas/projects/foundation_model_testing/weights/3DINO/3dino_vit_weights.pth
  preprocessing:
    intensity:
      mode: percentile
      lower: 0.05
      upper: 99.95
      b_min: -1.0
      b_max: 1.0
      clip: true
  kwargs:
    arch: vit_large_3d
    img_size: 112
    patch_size: 16
    in_chans: 1
    extract_blocks: [5, 11, 17, 23]
    interface: i1
    interface_width: 256
    interface_patch_size: [96, 96, 96]
    interface_upsampler: trilinear                                  # <-- skip variant
  grad_accum_steps: 2
  freeze_backbone: true
  pretrained: true
data:
  train_fraction: 1.0
  use_source_affine: true
  guide_hu: true                                             # <-- HU as channel 1
head:
  name: interface_seg_head
