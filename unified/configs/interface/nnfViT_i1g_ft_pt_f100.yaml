# nnFoundation ViT (Primus, 8^3 tokens, 539M encoder), FINE-TUNED end-to-end, with the pyramid-free
# I1 head and an upsampled stride-2 skip filled by guided (the dino3d-trained upsampler, unchanged and frozen).
# Pilot pair (2026-10-07): nnfViT_i1g vs nnfViT_i1t differ only in the marked skip line(s); both have
# the same trainable parameters. Question: does the guided upsampler still help once the encoder is
# trained too (frozen: dino3d +0.043, SAM-Med3D +0.052 over their controls)? Recipe = the benchmark's
# fine-tuning arms (base.yaml: AdamW lr 2e-4 for all parameters, 10 warm-up epochs, AMP, clip 1.0),
# batch 2 x 3 = 6 as the dino3d runs (3 x 2). Run for EPOCHS=150 (nnFoundation's short fine-tuning
# schedule). Preprocessing as the encoder's pretraining: SPL (SimpleITK arrays), z-score over all
# voxels; aug_scale 6 = a 3072-HU window over a typical whole-volume std of ~500 HU, so the additive
# augmentations have the same relative strength as for the [0, 1]-window encoders.
model:
  name: nnfoundation_vit
  batch_size: 2
  weights: /home/lukas/projects/foundation_model_testing/weights/nnFoundation/ViT/checkpoint_final.pth
  preprocessing:
    axcodes: SPL
    intensity:
      mode: znorm
      a_min: -1024.0
      a_max: 3071.0
      mask_threshold: -100000.0
      aug_scale: 6.0
  kwargs:
    canvas: [96, 96, 96]
    interface: i1
    interface_width: 256
    interface_patch_size: [96, 96, 96]
    interface_upsampler: guided                                  # <-- skip variant
    interface_upsampler_ckpt: /home/lukas/projects/foundation_model_testing/unified/runs/upsampler/dino3d_label/best.pt   # <--
  grad_accum_steps: 3
  freeze_backbone: false
  pretrained: true
data:
  train_fraction: 1.0
  use_source_affine: true
  guide_hu: true                                             # HU as channel 1 (ignored by trilinear)
head:
  name: interface_seg_head
train:
  val_interval_epochs: 10                                  # pilot: a comparison point every 10 epochs (both arms)
