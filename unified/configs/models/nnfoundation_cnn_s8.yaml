# nnFoundation CNN, stride-8 stage as the last output (matches the ViT token grid) (arXiv 2609.26924; MIC-DKFZ/nnFoundationCNN on Hugging Face, CC-BY-SA-4.0), frozen.
# See unified/models/backbones/nnfoundation.py. Pretraining preprocessing (adaptation_plan.json):
# SimpleITK arrays (z, y, x) -> SPL, as CT-FM; ZScoreNormalization over ALL voxels of the image
# (use_mask_for_norm false), no resampling. znorm with a wide clamp and no mask reproduces it.
model:
  name: nnfoundation_cnn
  batch_size: 2
  weights: /home/lukas/projects/foundation_model_testing/weights/nnFoundation/CNN/checkpoint_final.pth
  preprocessing:
    axcodes: SPL
    intensity:
      mode: znorm
      a_min: -1024.0
      a_max: 3071.0
      mask_threshold: -100000.0
  kwargs:
    max_stride: 8
