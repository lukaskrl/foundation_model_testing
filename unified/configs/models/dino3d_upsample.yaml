model:
  name: dino3d
  # observed 17.9 GB at bs=2 (AMP) — small per-sample footprint (small token grid).
  # bs=4 -> ~30 GB, plenty of slack on a 48 GB GPU.
  batch_size: 4
  weights: /home/lukas/projects/foundation_model_testing/weights/3DINO/3dino_vit_weights.pth
  preprocessing:
    # 3DINO normalizes by PER-VOLUME PERCENTILES, not a fixed HU window
    # (3DINO/dinov2/data/transforms.py:64, called with min_int=-1.0 from
    # eval/linear3d.py:471 and eval/segmentation3d.py:130):
    #   ScaleIntensityRangePercentilesd(lower=0.05, upper=99.95,
    #                                   b_min=-1.0, b_max=1.0, clip=True)
    # A fixed HU window is a different transform family, not just a different
    # window. The additive augmentations are auto-rescaled to this [-1, 1]
    # range (transforms.py:_intensity_aug_scale).
    intensity:
      mode: percentile
      lower: 0.05
      upper: 99.95
      b_min: -1.0
      b_max: 1.0
      clip: true
  kwargs:
    arch: vit_large_3d        # vit_base_3d or vit_large_3d
    # 3DINO was pretrained with 112³ patches (7×7×7 token grid). Constructing
    # the ViT at img_size=112 matches the pretrained pos_embed exactly; the
    # ViT's interpolate_pos_encoding handles arbitrary input sizes at forward.
    img_size: 112
    patch_size: 16
    in_chans: 1
    extract_blocks: [5, 11, 17, 23]
    # Probe-honest pyramid: synthesize all 5 contract levels by channel-
    # projecting + trilinearly upsampling the ViT bottleneck (no fresh
    # SpatialPriorModule conv on the raw input). A frozen run then measures the
    # pretrained representation itself, symmetric with the CNN encoders' 1x1
    # neck. Set to `spm` to restore the raw-input conv branch (ablation).
    pyramid_mode: upsample
