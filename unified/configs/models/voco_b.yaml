model:
  name: voco_b
  # bs=2: VRAM sweep peak 25.3 GB / 32.3 GB reserved — safe headroom for the
  # validation sliding-window spike on the 48 GB RTX 6000 Ada. bs=3 reserves
  # 48.2 GB (sweep flagged [OVER] the 46 GB safe cap); it runs standalone but
  # OOM-crashed at step 0 in the back-to-back batch under the slightest
  # contention from a preceding run.
  batch_size: 2
  weights: /home/lukas/projects/foundation_model_testing/weights/VoCo/VoComni_B.pt
  preprocessing:
    # VoCo pretrained with the narrow soft-tissue window
    # (Large-Scale-Medical/Self-supervised/voco_train.py:113 — a_min=-175,
    # a_max=250), the SAME window SuPreM uses. Previously VoCo inherited the
    # broad CT-FM window while suprem_swinunetr — identical architecture — got
    # the correct one, which made that pair uninterpretable.
    intensity:
      a_min: -175.0
      a_max: 250.0
      b_min: 0.0
      b_max: 1.0
      clip: true
  kwargs:
    feature_size: 48
    use_v2: true
    in_chans: 1
