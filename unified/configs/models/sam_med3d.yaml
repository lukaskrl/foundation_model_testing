model:
  name: sam_med3d
  # SAM-Med3D-turbo (vit_b_ori variant): 12-layer ViT, embed_dim=768,
  # patch=16, image_size=128 → token grid 8×8×8, neck projects to 384ch.
  # The adapter resizes any input patch to 128³ for the ViT pass and
  # resamples the bottleneck back to cubic stride 16.
  batch_size: 2
  weights: /store/home/skrljl/projects/foundation_models/weights/SAM-Med3D/sam_med3d_turbo.pth
  preprocessing:
    # SAM-Med3D clamps to [-1000, 1000] HU then z-scores over voxels > 0
    # (SAM-Med3D/utils/data_loader.py:62 + train.py:133
    #  tio.ZNormalization(masking_method=lambda x: x > 0)).
    #
    # This previously used a linear window on the argument that z-score-vs-linear
    # is "close to an affine reparametrization the first conv can absorb". That
    # argument does not hold, on two counts:
    #   1. It assumes the conv can adapt. In the frozen arm — half the matrix, and
    #      the headline probe column — the encoder is fixed, so nothing absorbs
    #      anything and the offset/scale mismatch is fed straight to pretrained
    #      weights.
    #   2. ZNormalization is per-volume and data-dependent (mean/std over the
    #      >0 HU mask), so it is not a fixed affine at all. It is adaptive
    #      contrast normalization, which is a substantive part of what makes the
    #      encoder scanner-robust, not a reparametrization.
    # `mode: znorm` reproduces upstream exactly, mask_threshold 0.0 included.
    #
    # znorm emits standard-deviation units rather than a declared range, so the
    # additive intensity augmentations (shift 0.10, noise std 0.10) need
    # `aug_scale` or they stop being the same strength relative to signal as they
    # are for the [0,1]-window encoders — see transforms.py:_intensity_aug_scale.
    #
    # 14.0 is MEASURED, not assumed: over 8 val cases the masked (HU > 0) signal
    # std is ~0.068 in window units and 1.0 in znorm units, i.e. a ratio of
    # median 13.9 / mean 14.3 (range 10.5-21.3). At the default aug_scale 1.0 the
    # additive augs would have been ~14x weaker here than for every other
    # encoder, which would have traded the normalization confound this fix
    # removes for an augmentation-strength one. The 10.5-21.3 spread is
    # irreducible — ZNormalization is per-volume adaptive, so no single constant
    # is exact for every case; it is a property of the normalization, not of this
    # choice of constant.
    #
    # Unfixed and NOT fixable here: SAM-Med3D pretrained on 128^3 @ 1.5 mm
    # (192 mm FOV) but the adapter resizes our 96^3 @ 1.5 mm patch (144 mm) up
    # to its 128^3 canvas -> 1.125 mm effective voxels, a 1.33x scale mismatch.
    intensity:
      mode: znorm
      a_min: -1000.0
      a_max: 1000.0
      mask_threshold: 0.0
      aug_scale: 14.0
  kwargs:
    arch: vit_b_ori
    patch_size: 16
    in_chans: 1
    window_size: 14
    out_chans: 384
    use_rel_pos: true
    # Probe-honest pyramid: synthesize all 5 contract levels by channel-
    # projecting + trilinearly resampling the ViT bottleneck (no fresh
    # SpatialPriorModule conv on the raw input). A frozen run then measures the
    # pretrained representation itself, symmetric with the CNN encoders' 1x1
    # neck. Set to `spm` to restore the raw-input conv branch (ablation).
    pyramid_mode: upsample
