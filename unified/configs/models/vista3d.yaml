model:
  name: vista3d
  batch_size: 3   # VRAM sweep: 37.3/51.5 GB reserved (fp32) at eff=6; bs4 = 49.5 GB
  # NO `amp:` override — vista3d inherits train.amp like every other encoder.
  #
  # It used to carry `amp: false` because fp16 AMP diverged around epoch 78 (the
  # loss scaler could not recover). That workaround is obsolete: the trainer now
  # prefers bf16 autocast wherever the GPU supports it (trainer.py:45-53), and
  # bf16 shares fp32's 8-bit exponent, so the overflow that caused that
  # divergence cannot occur and no GradScaler is involved.
  #
  # Leaving it in was a fairness defect, not just dead weight. `model.amp` is
  # read ahead of `train.amp`, so it escapes the base.yaml `train:` lock — and it
  # made the suite's top scorer the one model running a different numerical
  # recipe from the other sixteen. Do not reintroduce it without re-running the
  # whole matrix in fp32.
  weights: /home/lukas/projects/foundation_model_testing/weights/VISTA/vista3d_pretrained_model/model_monai1.3.pt
  preprocessing:
    # VISTA-3D's own HU window (VISTA/vista3d/configs/finetune/*.yaml:
    # ScaleIntensityRanged a_min=-963.8247715525971, a_max=1053.678477684517).
    # Feeding it the CT-FM window [-1024, 2048] compressed soft tissue by ~1.5x
    # relative to what the encoder was pretrained on.
    intensity:
      a_min: -963.8247715525971
      a_max: 1053.678477684517
      b_min: 0.0
      b_max: 1.0
      clip: true
  kwargs:
    # Match VISTA-3D's pretraining: 5 stages, init_filters=48
    # → native channels (48, 96, 192, 384, 768) at strides (1, 2, 4, 8, 16).
    # Adapter selects stages [1..4] for the pyramid contract.
    init_filters: 48
    blocks_down: [1, 2, 2, 4, 4]
    in_channels: 1
    norm: instance
