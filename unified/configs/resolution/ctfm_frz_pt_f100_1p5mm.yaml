# Resolution control: the 2.25 mm corpus's central negative result, re-run at NATIVE 1.5 mm.
#
# Every twin result in results/probes and runs/lowshot is at 2.25 mm, because the
# dataset's affine never reached MONAI and Spacingd(1.5) resampled already-1.5 mm data
# a second time (docs/ARCHITECTURE.md). Fine detail is largely gone at 2.25 mm, which is
# exactly where pretrained features would have least to offer — so "a random frozen twin
# retains 89-98%" might be an artifact of the coarsening rather than a fact about
# pretraining. This pair is byte-identical to its lowshot twin except use_source_affine.
#
# Read ONLY against each other, never against the 2.25 mm corpus.
model:
  name: ctfm
  amp: true
  batch_size: 3
  weights: /home/lukas/projects/foundation_model_testing/weights/CT-FM/ct_fm_feature_extractor/model.safetensors
  preprocessing:
    axcodes: SPL
    intensity:
      a_min: -1024.0
      a_max: 2048.0
      b_min: 0.0
      b_max: 1.0
      clip: true
  kwargs:
    init_filters: 32
    blocks_down:
    - 1
    - 2
    - 2
    - 4
    - 4
    in_channels: 1
    norm: instance
  grad_accum_steps: 2
  freeze_backbone: true
  pretrained: true
data:
  train_fraction: 1.0
  use_source_affine: true
