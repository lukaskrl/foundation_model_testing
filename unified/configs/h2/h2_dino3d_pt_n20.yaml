# H2 pilot — wiring target: dino3d (ViT-L, never seen by any source head).
# Train with --init-head-from <source head> --freeze-head to wire it into a
# pretrained head (only the 1,017,792-param layerwise adapter trains), or without
# those flags for the fresh-head baseline. n20: 20 training scans (round(1082*0.0185)=20), tiled to full epoch length so steps/schedule match the full-data runs.
# pretrained: true (real 3DINO weights). 2.25 mm corpus.
model:
  name: dino3d
  batch_size: 3
  weights: /home/lukas/projects/foundation_model_testing/weights/3DINO/3dino_vit_weights.pth
  preprocessing:
    intensity:
      mode: percentile
      lower: 0.05
      upper: 99.95
      b_min: -1.0
      b_max: 1.0
      clip: true
  kwargs:
    arch: vit_large_3d
    img_size: 112
    patch_size: 16
    in_chans: 1
    extract_blocks: [5, 11, 17, 23]
    pyramid_mode: layerwise
  grad_accum_steps: 2
  freeze_backbone: true
  pretrained: true
data:
  train_fraction: 0.0185
  fixed_epoch_length: true
